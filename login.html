<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .switch a {
            color: #4f46e5;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        #registerForm {
            display: none;
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <h1 id="formTitle">Login</h1>

        <p class="subtitle">
            Welcome to Task Manager
        </p>

        <!-- Login Form -->

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>


        <!-- Register Form -->

        <form id="registerForm">

            <label>Name</label>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>


        <p id="message"></p>


        <div class="switch">

            <span id="switchText">
                Don't have an account?
            </span>

            <a id="switchBtn">
                Register
            </a>

        </div>

    </div>


    <script src="auth.js"></script>

</body>
</html>
