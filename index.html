<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Management App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <div>
                <h1>Task Manager</h1>
                <p>Manage your tasks easily</p>
            </div>

            <button id="addTaskBtn" class="add-btn">
                + Add Task
            </button>
        </header>


        <!-- Task Statistics -->
        <section class="stats">

            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>To Do</h3>
                <p id="todoTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>In Progress</h3>
                <p id="progressTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

        </section>


        <!-- Search and Filter -->
        <section class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search tasks..."
            >

            <select id="filterStatus">
                <option value="all">All Tasks</option>
                <option value="todo">To Do</option>
                <option value="progress">In Progress</option>
                <option value="completed">Completed</option>
            </select>

        </section>


        <!-- Tasks -->
        <section>

            <h2>My Tasks</h2>

            <div id="taskList">

                <!-- Tasks will appear here -->

            </div>

        </section>

    </div>


    <!-- Add/Edit Task Modal -->

    <div id="taskModal" class="modal">

        <div class="modal-content">

            <span id="closeModal" class="close">
                &times;
            </span>

            <h2 id="modalTitle">
                Add New Task
            </h2>

            <form id="taskForm">

                <input
                    type="hidden"
                    id="taskId"
                >

                <label>
                    Task Title
                </label>

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter task title"
                    required
                >


                <label>
                    Description
                </label>

                <textarea
                    id="taskDescription"
                    placeholder="Enter task description"
                ></textarea>


                <label>
                    Status
                </label>

                <select id="taskStatus">

                    <option value="todo">
                        To Do
                    </option>

                    <option value="progress">
                        In Progress
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                </select>


                <label>
                    Priority
                </label>

                <select id="taskPriority">

                    <option value="low">
                        Low
                    </option>

                    <option value="medium">
                        Medium
                    </option>

                    <option value="high">
                        High
                    </option>

                </select>


                <label>
                    Due Date
                </label>

                <input
                    type="date"
                    id="taskDate"
                >


                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Task
                </button>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
